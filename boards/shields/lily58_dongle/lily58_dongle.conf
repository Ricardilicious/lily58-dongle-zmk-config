# OLED: screen comes from the zmk-dongle-display add-on (englmaxi)
CONFIG_ZMK_DISPLAY=y

# Screen widgets
CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=y
CONFIG_ZMK_DONGLE_DISPLAY_WPM=y
CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER=y
CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="left"

# Get both halves' battery levels on the dongle (and on the PC)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Dongle is always on USB, no need for sleep
CONFIG_ZMK_SLEEP=n
