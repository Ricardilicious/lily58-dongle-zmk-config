# OLED with a custom screen (both halves' batteries + output + layer)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS=n
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y

# The built-in screen gets a bigger LVGL memory pool automatically; a custom one doesn't.
# Too little memory = screen never gets drawn (random 'static' on the OLED).
CONFIG_LV_Z_MEM_POOL_SIZE=8192

# Get both halves' battery levels on the dongle (and on the PC)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Dongle is always on USB, no need for sleep
CONFIG_ZMK_SLEEP=n
