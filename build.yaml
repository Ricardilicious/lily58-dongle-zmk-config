# Dongle = central (nice!nano #3 + 1.3" SH1106 OLED)
# Both Lily58 halves = peripherals
---
include:
  - board: nice_nano_v2
    shield: lily58_dongle dongle_display
  - board: nice_nano_v2
    shield: lily58_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano_v2
    shield: lily58_right
  - board: nice_nano_v2
    shield: settings_reset
