# Dongle = central (nice!nano #3 + 1.3" SH1106 OLED)
# Both Lily58 halves = peripherals
---
include:
  - board: nice_nano_v2
    shield: lily58_dongle
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
  # DEBUG: dongle with USB logging + ZMK's built-in screen (to diagnose the OLED)
  - board: nice_nano_v2
    shield: lily58_dongle
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000 -DCONFIG_I2C_LOG_LEVEL_DBG=y -DCONFIG_DISPLAY_LOG_LEVEL_DBG=y
    artifact-name: DEBUG_dongle_usb_logging
  - board: nice_nano_v2
    shield: lily58_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano_v2
    shield: lily58_right
  - board: nice_nano_v2
    shield: settings_reset
